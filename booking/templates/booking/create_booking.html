{% extends 'booking/base.html' %}

{% block content %}
<h1 class="text-center">Новая заявка</h1>

<h2>Доступные помещения</h2>
{% for room in rooms %}
<div class="card mb-2 p-2">
    <h3>{{ room.name }}</h3>
    <p class="small-text">{{ room.get_room_type_display }} | {{ room.capacity }} мест</p>
    <p><strong>{{ room.price }} руб/час</strong></p>
</div>
{% endfor %}

<h2>Форма бронирования</h2>
<form method="post">
    {% csrf_token %}
    
    <div class="mb-3">
        <label class="form-label">Помещение</label>
        <select name="room" class="form-select" required>
            <option value="">Выберите...</option>
            {% for room in rooms %}
            <option value="{{ room.id }}">{{ room.name }} - {{ room.price }} руб/час</option>
            {% endfor %}
        </select>
    </div>
    
    <div class="mb-3">
        <label class="form-label">Дата и время</label>
        <input type="datetime-local" name="date" class="form-control" required>
    </div>
    
    <div class="mb-3">
        <label class="form-label">Способ оплаты</label>
        <select name="payment" class="form-select" required>
            <option value="">Выберите...</option>
            <option value="cash">Наличные</option>
            <option value="card">Банковская карта</option>
            <option value="transfer">Безналичный перевод</option>
        </select>
    </div>
    
    <button type="submit" class="btn btn-primary w-100">Отправить</button>
</form>
{% endblock %}
