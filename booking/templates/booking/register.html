<!DOCTYPE html>
<html>
<head>
    <title>Регистрация</title>
</head>
<body>
    <h1>Регистрация</h1>

    {% if messages %}
        {% for msg in messages %}
            <p style="color: red;">{{ msg }}</p>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Зарегистрироваться</button>
    </form>

    <p><a href="{% url 'login' %}">Уже есть аккаунт? Войти</a></p>
</body>
</html>
